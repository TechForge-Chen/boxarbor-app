name: iOS Release (App Store)

# 手动触发：Actions 页面点 "Run workflow"
# 打 iOS 包（macOS runner），可选自动上传 TestFlight。
on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "打包后上传 TestFlight"
        type: boolean
        default: false
      build_number:
        description: "Build 号（留空 = 用 CI 运行号，每次上传必须递增）"
        required: false

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PROJECT: Net.csproj
      TFM: net10.0-ios
      CONFIG: Release
      RID: ios-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          dotnet --version

      - name: Select Xcode
        # .NET for iOS 26.5 要求精确匹配 Xcode 26.5；runner 默认可能是更新的版本
        run: |
          echo "Installed Xcodes:"
          ls -1 /Applications | grep -i '^Xcode' || true
          if [ -d "/Applications/Xcode_26.5.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          elif [ -d "/Applications/Xcode_26.5.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.0.app
          fi
          xcodebuild -version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.301"

      - name: Install MAUI iOS workload
        # 固定 workload set：runner 上的 Xcode 为 26.6，需要 iOS SDK 26.x；
        # 最新 workload（iOS SDK 27.1）会要求 Xcode 27.1 导致构建失败。
        run: dotnet workload install maui-ios --version 10.0.301.1

      # ---------- 签名：导入分发证书 + 描述文件 ----------
      # 仓库 Settings → Secrets 里配置：
      #   IOS_CERT_P12_BASE64        分发证书 .p12 的 base64
      #   IOS_CERT_PASSWORD          .p12 密码
      #   IOS_PROVISIONING_PROFILE_BASE64  App Store 描述文件的 base64
      #   IOS_PROVISIONING_PROFILE_NAME    描述文件名称（Apple 后台里显示的 Name）
      #   IOS_SIGNING_IDENTITY       e.g. "Apple Distribution: XXX (TEAMID)"
      - name: Import signing certificate
        id: signing
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          if [ -z "$IOS_CERT_P12_BASE64" ]; then
            echo "::warning::未配置签名证书，将尝试无签名构建（不能上架）"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$IOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Install provisioning profile
        if: steps.signing.outputs.signed == 'true'
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          # 用 UUID 命名，codesign 才能稳定找到
          UUID=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract UUID raw -)
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "profile uuid: $UUID"

      # ---------- 构建 IPA ----------
      - name: Publish IPA
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          BUILD_NUMBER="${BUILD_NUMBER:-${GITHUB_RUN_NUMBER}}"

          if [ "$SIGNED" = "true" ]; then
            dotnet publish "$PROJECT" \
              -f "$TFM" -c "$CONFIG" \
              -p:TargetFrameworks="$TFM" \
              -p:RuntimeIdentifier="$RID" \
              -p:BuildIpa=true \
              -p:ArchiveOnBuild=true \
              -p:ApplicationVersion="$BUILD_NUMBER" \
              -p:CodesignKey="$IOS_SIGNING_IDENTITY" \
              -p:CodesignProvision="$IOS_PROVISIONING_PROFILE_NAME"

            IPA=$(find . -name "*.ipa" -not -path "*/obj/*" | head -1)
            echo "IPA: $IPA"
            echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          else
            # 没有签名材料时不做设备包（无法签名），改为在 macOS 上做 iOS 编译校验
            echo "::warning::未配置 Apple 签名证书，改为 iOS 编译校验（不产出 IPA）"
            dotnet build "$PROJECT" \
              -f "$TFM" -c "$CONFIG" \
              -p:TargetFrameworks="$TFM" \
              -p:RuntimeIdentifier=iossimulator-arm64
            echo "IPA_PATH=" >> "$GITHUB_ENV"
          fi

      - name: Upload IPA artifact
        if: env.IPA_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      # ---------- 上传 TestFlight ----------
      # Secrets：
      #   APPSTORE_API_KEY_ID / APPSTORE_API_ISSUER_ID / APPSTORE_API_KEY_P8
      #   （App Store Connect → 用户和访问 → 密钥 → App Store Connect API）
      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight && env.IPA_PATH != '' }}
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
