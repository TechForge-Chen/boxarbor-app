name: iOS Simulator Screenshot

# 手动触发：Actions 页面点 "Run workflow"
# 在 macOS runner 上启动 iPhone 模拟器，安装模拟器版 App 并截图（验证安全区/底栏）。
# 不需要签名；模拟器里点不了，只能看启动页（StartPage）。
on:
  workflow_dispatch:

jobs:
  sim-shot:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PROJECT: Net.csproj
      TFM: net10.0-ios
      CONFIG: Release
      SIM_RID: iossimulator-arm64
      BUNDLE_ID: com.boxarbor.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_26.5.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          elif [ -d "/Applications/Xcode_26.5.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.0.app
          fi
          xcodebuild -version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.301"

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --version 10.0.301.1

      - name: Build simulator app
        run: |
          dotnet build "$PROJECT" \
            -f "$TFM" -c "$CONFIG" \
            -p:TargetFrameworks="$TFM" \
            -p:RuntimeIdentifier="$SIM_RID"
          APP=$(find . -type d -name "Net.app" -not -path "*/obj/*" | head -1)
          echo "APP: $APP"
          echo "SIM_APP=$APP" >> "$GITHUB_ENV"

      - name: Boot iPhone simulator and screenshot
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin); ds=[x for vs in d['devices'].values() for x in vs if 'iPhone' in x.get('name','')]; print(ds[0]['udid'])")
          echo "Using simulator: $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          sleep 20
          xcrun simctl install "$UDID" "$SIM_APP"
          mkdir -p "$GITHUB_WORKSPACE/simshots"

          # 1) 首页（看底部栏是否坐到底边、顶部是否融合）
          SIMCTL_CHILD_BOXARBOR_LIGHT=1 xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 12
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simshots/1-home.png"

          # 2) Devices + 扫描弹窗（看遮罩是否盖住状态栏/底部）
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          SIMCTL_CHILD_BOXARBOR_LIGHT=1 SIMCTL_CHILD_BOXARBOR_SHOT=picker xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 14
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simshots/2-picker.png"

          # 3) 暗色首页（看状态栏文字与暗色底栏）
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          SIMCTL_CHILD_BOXARBOR_DARK=1 xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 12
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simshots/3-dark.png"

          # 5) 新手引导（看引导蒙层是否盖住状态栏）
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          SIMCTL_CHILD_BOXARBOR_SHOT=guide SIMCTL_CHILD_BOXARBOR_LIGHT=1 xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 12
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simshots/5-guide.png"

          # 4) 暗色 + 扫描弹窗（看暗色下遮罩顶部是否同色）
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          SIMCTL_CHILD_BOXARBOR_DARK=1 SIMCTL_CHILD_BOXARBOR_SHOT=picker xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 14
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simshots/4-picker-dark.png"

          # 6) Devices / Settings（亮+暗）
          for T in devices settings; do
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            SIMCTL_CHILD_BOXARBOR_LIGHT=1 SIMCTL_CHILD_BOXARBOR_SHOT=$T xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 12
            xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simshots/6-$T.png"

            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            SIMCTL_CHILD_BOXARBOR_DARK=1 SIMCTL_CHILD_BOXARBOR_SHOT=$T xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 12
            xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simshots/6-$T-dark.png"
          done

          # 7) 引导抖动复现：引导打开后连拍 3 张（间隔约 1s，无任何点击）
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          SIMCTL_CHILD_BOXARBOR_LIGHT=1 SIMCTL_CHILD_BOXARBOR_SHOT=guideframes xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 8
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simshots/7-guide-a.png"
          sleep 1
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simshots/7-guide-b.png"
          sleep 1
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simshots/7-guide-c.png"

          # 8) 改名保存白屏复现：自动打开改名→填名→保存保存后 0.5s/1.5s/3s 各截一张
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          SIMCTL_CHILD_BOXARBOR_LIGHT=1 SIMCTL_CHILD_BOXARBOR_SHOT=rename xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 5
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simshots/8-rename-a.png"
          sleep 1
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simshots/8-rename-b.png"
          sleep 2
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simshots/8-rename-c.png"

          # 9) 改名保存白屏定位：同一流程跑 4 遍（基线 / 去 Unfocus / 去遮罩染色 / 去回填）
          for V in base nounfocus nodim noconfirm; do
            unset SIMCTL_CHILD_BOXARBOR_NO_UNFOCUS SIMCTL_CHILD_BOXARBOR_NO_DIM SIMCTL_CHILD_BOXARBOR_NO_CONFIRM
            if [ "$V" = "nounfocus" ]; then export SIMCTL_CHILD_BOXARBOR_NO_UNFOCUS=1; fi
            if [ "$V" = "nodim" ]; then export SIMCTL_CHILD_BOXARBOR_NO_DIM=1; fi
            if [ "$V" = "noconfirm" ]; then export SIMCTL_CHILD_BOXARBOR_NO_CONFIRM=1; fi
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            SIMCTL_CHILD_BOXARBOR_LIGHT=1 SIMCTL_CHILD_BOXARBOR_SHOT=rename xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 5
            xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simshots/9-rename-$V-a.png"
            sleep 2
            xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simshots/9-rename-$V-b.png"
          done

          # 10) 引导切步抖动：自动每 1.2s 切一步，连拍 6 张
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          SIMCTL_CHILD_BOXARBOR_LIGHT=1 SIMCTL_CHILD_BOXARBOR_SHOT=guideframes SIMCTL_CHILD_BOXARBOR_GUIDE_ADV_MS=1200 xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 4
          for i in 1 2 3 4 5 6; do
            xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simshots/10-guide-$i.png"
            sleep 1
          done

          ls -la "$GITHUB_WORKSPACE/simshots"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-simshots
          path: simshots/
          if-no-files-found: error
